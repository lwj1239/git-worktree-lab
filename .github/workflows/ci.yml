name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.25"
      - name: 同步锁定依赖
        run: uv sync --locked
      - name: Ruff 检查
        run: uv run ruff check .
      - name: pytest 测试
        run: uv run pytest
