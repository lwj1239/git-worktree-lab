[project]
name = "git-worktree-lab"
version = "0.1.0"
description = "用于 Git 与 Worktree 协作实验的命令行文本工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
git-worktree-lab = "git_worktree_lab:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
